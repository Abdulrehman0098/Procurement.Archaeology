version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: pa-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_export_file_use__neo4j__home=true
      - NEO4J_apoc_import_file_use__neo4j__home=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allow__sync__non__kernel__writers=true
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: pa-elasticsearch
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pa-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T23-20-18Z
    container_name: pa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  api:
    build: ./apps/api
    container_name: pa-api
    environment:
      - DATABASE_URL=sqlite:///./data.db
      - DATABASE_URL_FALLBACK=${DATABASE_URL}
      - NEXT_PUBLIC_API_URL=http://localhost:${PORT}
      - NEXT_PUBLIC_ADMIN_URL=http://localhost:${ADMIN_PORT}
      - ADMIN_URL=http://localhost:${ADMIN_PORT}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - API_SECRET_KEY=${API_SECRET_KEY}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  web:
    build: ./apps/web
    container_name: pa-web
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - API_URL=http://localhost:${API_PORT}
    ports:
      - "${PORT}:3000"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build: ./apps/admin
    container_name: pa-admin
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - API_URL=http://localhost:${API_PORT}
    ports:
      - "${ADMIN_PORT}:3001"
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_plugins:
  es_data:
  minio_data:
  api_data:
