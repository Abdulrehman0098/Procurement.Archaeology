<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<title>Procurement Archaeology logo</title>
<description>A stylised letter P blending a trowel and a document seal.</description>
<defs>
<linearGradient id="amberGradient" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffbe4d"/>
<stop offset="100%" stop-color="#c97f0a"/>
</linearGradient>
<radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
<stop offset="0%" stop-color="#f5a524" stop-opacity="0.12"/>
<stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
</radialGradient>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
</filter>
</defs>
<g id="mark-container" filter="url(#softShadow)">
<rect x="0" y="0" width="64" height="64" rx="9" fill="url(#innerGlow)" stroke="#c97f0a" stroke-width="1"/>
<g id="mark-p-trowel-seal">
<path id="p-outline" d="M14,6 L26,6 C42,6 54,14 54,24 C54,34 42,38 26,38 L21,54 Q20,57 18,54 L17,38 L14,38 Z M39,15 A7,7 0 1,0 39,29 A7,7 0 1,0 39,15 Z" fill="url(#amberGradient)" fill-rule="evenodd"/>
<circle id="seal-dot" cx="39" cy="22" r="1.5" fill="#c97f0a"/>
</g>
</g>
</svg>
